version: '3.1'

services:
  jdbc-db:
    container_name: quickstart-jdbc-database
    image: postgres
    ports:
      - "5433:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: root

  jpa-db:
    container_name: quickstart-jpa-database
    image: postgres
    ports:
      - "5434:5432"
    restart: always
    environment:
      POSTGRES_PASSWORD: root