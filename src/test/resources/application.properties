# JDBC Datasource (teste)
spring.datasource.jdbc.jdbc-url=jdbc:h2:mem:jdbcdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.jdbc.driver-class-name=org.h2.Driver
spring.datasource.jdbc.username=sa
spring.datasource.jdbc.password=password

# JPA Datasource (teste)
spring.datasource.jpa.jdbc-url=jdbc:h2:mem:jpadb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.jpa.driver-class-name=org.h2.Driver
spring.datasource.jpa.username=sa
spring.datasource.jpa.password=password