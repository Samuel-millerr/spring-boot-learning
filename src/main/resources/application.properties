spring.application.name=quickstart

#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password

# JDBC Datasource
spring.datasource.jdbc.jdbc-url=jdbc:postgresql://localhost:5433/postgres
spring.datasource.jdbc.driver-class-name=org.postgresql.Driver
spring.datasource.jdbc.username=postgres
spring.datasource.jdbc.password=root

# JPA Datasource
spring.datasource.jpa.jdbc-url=jdbc:postgresql://localhost:5434/postgres
spring.datasource.jpa.driver-class-name=org.postgresql.Driver
spring.datasource.jpa.username=postgres
spring.datasource.jpa.password=root

# Hibernate
spring.jpa.hibernate.ddl-auto=update
app.jpa.show-sql=true
app.jpa.properties.hibernate.format_sql=true